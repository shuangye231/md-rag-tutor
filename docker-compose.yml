name: ai-tutor

services:
  tutor:
    build: .
    ports:
      - "8899:8899"
    environment:
      DATA_DIR: /data
      HF_HOME: /model-cache
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      PORT: 8899
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      PRO_API_KEY: ${PRO_API_KEY:-}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-https://api.ccode.vip/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      HF_OFFLINE: ${HF_OFFLINE:-0}
    volumes:
      - ./data:/data
      - ./.hf-cache:/model-cache
    restart: unless-stopped
