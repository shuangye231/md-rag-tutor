<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="全能 AI 导师，你的 AI 学习工作台" />
    <script>
      (() => {
        const saved = localStorage.getItem('theme');
        const theme = saved === 'dark' || saved === 'dim' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (saved === 'dim') localStorage.setItem('theme', 'dark');
      })();
    </script>
    <title>全能 AI 导师</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
